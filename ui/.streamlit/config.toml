[server]
maxUploadSize = 10             # MB; invoices are small
showEmailPrompt = false        # no first-run email prompt
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"          # keeps the theme switch, hides developer menu items
showSidebarNavigation = false   # navigation comes from st.navigation in app.py

[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 15
headingFontSizes = ["1.625rem", "1.25rem", "1.0625rem", "0.9375rem", "0.875rem", "0.8125rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFontSize = "0.8125rem"
metricValueFontSize = "1.75rem"
metricValueFontWeight = 500
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
linkUnderline = true

[theme.light]
primaryColor = "#1D2733"
backgroundColor = "#F6F8F5"
secondaryBackgroundColor = "#E8EDE6"
textColor = "#1D2733"
linkColor = "#1D2733"
