[project]
name = "acme-invoices"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "langgraph==1.2.22",
  "langgraph-checkpoint-sqlite==3.1.3",
  "openai==3.51.0",
  "pydantic==2.14.3",
  "pdfplumber==0.11.10",
  "rich==15.0.0",
  "python-dotenv==1.2.4",
]
[dependency-groups]
dev = ["pytest==9.2.0"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real Grok API (needs XAI_API_KEY); deselected by default"]
